services:
  postgres:
    image: postgres:16-alpine
    container_name: ekosrekja-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-EkoSrekja}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgre}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ekosrekja-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-EkoSrekja}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ekosrekja-postgres-data:
